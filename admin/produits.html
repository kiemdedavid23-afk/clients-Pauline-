<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mes produits — Administration Chez Tantie Pauline</title>
  <meta name="robots" content="noindex, nofollow">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body admin-guard-pending">

  <div id="admin-nav"></div>

  <main class="admin-main">
    <div class="admin-page-container">

      <div class="admin-page-header-row">
        <div>
          <h1 class="admin-page-title">Mes produits</h1>
          <p class="admin-page-lead">Gérez les articles de la collection.</p>
        </div>
        <a href="produit.html" class="btn-primary admin-add-btn">+ Ajouter un produit</a>
      </div>

      <input type="search" class="admin-search-input" id="adminSearchInput" placeholder="Rechercher un produit...">

      <div class="collection-filters-container admin-filters-container">
        <button type="button" class="filter-pill active" data-filter="tous">Tous</button>
        <button type="button" class="filter-pill" data-filter="sacs">Sacs</button>
        <button type="button" class="filter-pill" data-filter="chaussures">Chaussures</button>
        <button type="button" class="filter-pill" data-filter="disponible">Disponibles</button>
        <button type="button" class="filter-pill" data-filter="peu_de_stock">Peu de stock</button>
        <button type="button" class="filter-pill" data-filter="rupture">Rupture</button>
      </div>

      <div class="admin-products-list" id="adminProductsList"></div>

      <div class="products-empty-state" id="adminProductsEmpty" hidden>
        <p class="products-empty-title">Aucun produit ne correspond à cette recherche.</p>
      </div>

    </div>
  </main>

  <script src="js/admin-api.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
